<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ghalamnama — Settings</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    main { max-width: 560px; margin: 0 auto; padding: 24px 16px 40px; }
    section { margin-bottom: 20px; }
  </style>
</head>
<body>
  <main>
    <h1>Ghalamnama settings</h1>

    <section id="languages-section" aria-labelledby="languages-heading">
      <h2 id="languages-heading">Languages</h2>
      <p>Choose which languages appear in the keyboard language selector.</p>
      <fieldset id="language-settings">
        <legend>Enabled languages</legend>
        <label><input type="checkbox" value="fa"> فارسی</label>
        <label><input type="checkbox" value="ar"> العربية</label>
        <label><input type="checkbox" value="he"> עברית</label>
        <label><input type="checkbox" value="ru"> Русский</label>
        <label><input type="checkbox" value="el"> Ελληνικά</label>
      </fieldset>
      <label for="default-language">Default language</label>
      <select id="default-language">
        <option value="fa">فارسی</option>
        <option value="ar">العربية</option>
        <option value="he">עברית</option>
        <option value="ru">Русский</option>
        <option value="el">Ελληνικά</option>
      </select>
    </section>

    <section id="typing-section" aria-labelledby="typing-heading">
      <h2 id="typing-heading">Typing</h2>
      <label for="typing-mode">Default typing mode</label>
      <select id="typing-mode">
        <option value="ghalamnama">Ghalamnama — physical keys are remapped to the selected layout</option>
        <option value="os">OS — physical keys behave normally; the on-screen keyboard stays available</option>
      </select>
    </section>

    <section aria-labelledby="appearance-heading">
      <h2 id="appearance-heading">Appearance</h2>
      <label><input type="checkbox" id="key-highlight"> Highlight virtual keys while typing on the physical keyboard</label>
    </section>

    <section aria-labelledby="behavior-heading">
      <h2 id="behavior-heading">Behavior</h2>
      <label><input type="checkbox" id="reveal-shortcut"> Alt + Shift + K shows the floating control after it was hidden</label>
    </section>

    <p id="error" role="alert" hidden></p>
    <p id="saved" role="status" hidden>Settings saved.</p>
    <button id="save" type="button">Save settings</button>
    <button id="reset" type="button">Reset all settings</button>
  </main>
  <script src="options.js"></script>
</body>
</html>
